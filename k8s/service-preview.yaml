# T6 — Service interno de pré-visualização.
# O deploy aponta este Service para a cor recém-implantada ANTES da troca, para rodar os smoke tests.
# Depois da troca ele continua nessa cor (o rollback não o atualiza); é usado só pelos smoke tests.
# ClusterIP: não fica exposto na internet.
apiVersion: v1
kind: Service
metadata:
  name: biblioteca-preview
  labels:
    app: biblioteca
spec:
  type: ClusterIP
  selector:
    app: biblioteca
    version: green
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
