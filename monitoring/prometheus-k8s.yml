# T6/T7 — Prometheus do compose coletando os pods blue/green do Kubernetes (Docker Desktop)
# Os pods são expostos em localhost por scripts/port-forward-metricas.sh:
#   blue -> 18081 | green -> 18082   (porta 8081 do pod = métricas)
# O job continua "biblioteca" para o painel e os alertas funcionarem sem alteração.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: biblioteca
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18081"]
        labels:
          cor: blue
      - targets: ["host.docker.internal:18082"]
        labels:
          cor: green
