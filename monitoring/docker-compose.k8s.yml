# T6/T7 — Prometheus + Grafana apontando para os pods do Kubernetes (sem o container "biblioteca" do compose)
# Pré-requisito: ./scripts/port-forward-metricas.sh rodando em outro terminal.
# Uso (a partir da pasta monitoring/; derrube o compose normal antes: docker compose down):
#   docker compose -f docker-compose.k8s.yml up -d
# Acessos: Prometheus http://localhost:9090 | Grafana http://localhost:3000 (Dashboards > T7)
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus-k8s.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # somente para a demonstração local
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
