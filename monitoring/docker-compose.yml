# T7 — Demonstração local de observabilidade (sem custo de nuvem)
# Sobe: Biblioteca + Prometheus (métricas e alertas) + Grafana (painel)
#
# Uso (a partir da pasta monitoring/):
#   export API_SECURITY_TOKEN_SECRET="$(openssl rand -base64 48)"
#   docker compose up -d --build
#
# Acessos:
#   Biblioteca  http://localhost:8080/login        (admin / admin)
#   Prometheus  http://localhost:9090/alerts
#   Grafana     http://localhost:3000              (painel em Dashboards > T7)

services:
  biblioteca:
    build: ../biblioteca-master
    environment:
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:?defina API_SECURITY_TOKEN_SECRET antes de subir}
      APP_VERSION: local
    ports:
      - "8080:8080"     # 8081 (métricas) fica só na rede interna do compose

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - biblioteca

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # somente para a demonstração local
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
