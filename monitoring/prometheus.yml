# T7 — Configuração do Prometheus para a demonstração local (docker compose)
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: biblioteca
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["biblioteca:8081"]
