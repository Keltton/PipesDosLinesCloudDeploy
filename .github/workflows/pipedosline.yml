name: pipedosline Biblioteca

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biblioteca-master
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: biblioteca-master/pom.xml

      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-${{ github.sha }}
          path: biblioteca-master/target/*.jar
