spring.application.name=biblioteca

server.port=8080

#datasource
spring.datasource.url=jdbc:h2:mem:banco
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

#JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

#h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#jwt
api.security.token.secret=minha-chave-secreta-deve-ter-256-bits-aqui!!

#T7 - observabilidade (Actuator + Prometheus)
# Porta separada: as metricas nao saem pelo Service publico (8080)
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.version=${APP_VERSION:local}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
